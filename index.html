            "@type": "Answer",
            "text": "A Olympkus AI é uma empresa brasileira que constrói uma suíte de agentes de inteligência artificial para a vida pessoal. A suíte, chamada Panteão, reúne três agentes especializados: Pluto (finanças), Aion (tempo e tarefas) e Zeus (orquestração). O diferencial é ter um agente por domínio, orquestrados por um comando único — em vez de um assistente genérico."

        },
        {
          "@type": "Question",
          "name": "O que é IA agêntica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "IA agêntica é inteligência artificial que age por você, não apenas responde perguntas. Em vez de um chatbot que você precisa operar, um agente executa tarefas dentro de limites que você define: aprova a intenção, o agente cuida da execução. A Olympkus aplica esse conceito a finanças pessoais, gestão de tempo e orquestração da vida pessoal."
          }
        },

          "@type": "Question",
          "name": "O que é o Pluto da Olympkus?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pluto é o agente de finanças pessoais da Olympkus AI. Ele lê suas contas, antecipa faturas e prepara pagamentos e transferências para a sua aprovação. Você define os limites e aprova cada intenção — não é piloto automático, é delegação com controle. Lançamento previsto para janeiro de 2027."
          }
        },
        {
          "@type": "Question",
          "name": "Quando o Pluto da Olympkus vai lançar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O lançamento do Pluto está previsto para janeiro de 2027. A lista de espera está aberta em olympkusai.com — os primeiros da fila entram como membros fundadores, com condições especiais no lançamento."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre Olympkus e assistentes de IA como ChatGPT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O ChatGPT e outros assistentes genéricos respondem perguntas sobre qualquer assunto, mas não conhecem profundamente suas contas, seu calendário ou suas prioridades — você precisa explicar tudo, toda vez. A Olympkus tem um agente especializado por domínio: Pluto conhece suas finanças em profundidade, Aion conhece seu tempo. Cada agente é excelente no que faz, e Zeus orquestra tudo sob um só comando."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre Olympkus e apps de finanças com IA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Apps como Aizen e Cleo fazem autonomia em um único domínio (dinheiro). A Olympkus propõe autonomia coordenada em toda a vida pessoal — finanças, tempo e orquestração — com um agente especializado por domínio. Além disso, o modelo da Olympkus é 'você aprova, o agente executa': controle, não apenas automação cega. É o oposto explícito de produtos que executam sem sua permissão."
          }
        },
        {
          "@type": "Question",
          "name": "O que significa 'você aprova, o agente executa'?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Significa que nenhum agente da Olympkus executa uma ação significativa sem a sua aprovação. Você define os limites — quais categorias de ação o agente pode fazer sozinho, quais precisam de permissão — e o agente age dentro desses limites. Não é piloto automático: é delegação com controle. Você pode ver e revogar qualquer permissão a qualquer momento."
